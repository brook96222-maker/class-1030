<style>
:root{color-scheme:light;--ink:#202a24;--muted:#758078;--line:#e5e9e3;--paper:#fff;--bg:#f5f7f3;--green:#315c45;--green-dark:#244a36;--mint:#e8f1e9;--orange:#bd754c;--lav:#efedf8;--blue:#e9f0f6;--shadow:0 8px 28px rgba(43,62,47,.075);--shadow-soft:0 3px 12px rgba(43,62,47,.05)}

ze:12px;line-height:15px}.task-copy{flex:1;min-width:0}.task-title{font-size:12px;font-weight:670}.task-row.done .task-title{text-decoration:line-through;color:#9ca69d}.task-sub{display:flex;gap:8px;align-items:center;color:#849087;font-size:10px;margin-top:4px;flex-wrap:wrap}.priority{font-size:9px;padding:2px 6px;border-radius:6px;font-weight:650}.priority.high{color:#ac5c48;background:#faeeea}.priority.medium{color:#9a702f;background:#f8f2e6}.priority.low{color:#5f7963;background:#edf3ed}.quick{display:flex;gap:8px;margin-top:13px}.quick input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;font-size:12px}.quick input:focus,input:focus,select:focus,textarea:focus{border-color:#88a38e;box-shadow:0 0 0 3px #eaf2e9}.quick button{padding:8px 12px;border-radius:9px;border:0;background:#e8f1e9;color:var(--green);font-weight:680;transition:background .15s,transform .15s}.quick button:hover{background:#dceadd;transform:translateY(-1px)}.quick button#fullTaskAdd{background:#f0f3ed;color:#667268}.right-column .panel{padding:18px}.view-all{border:0;background:none;color:var(--green);font-size:11px;font-weight:680;border-radius:7px;padding:5px 7px}.view-all:hover{background:#edf3ec}.progress{display:flex;justify-content:space-between;font-size:11px;color:#748078;margin:12px 0 7px}.progress-track{height:8px;border-radius:9px;background:#edf1eb;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#8fb392,#4f805b);border-radius:9px;transition:width .25s}.upcoming{display:grid;gap:12px}.up-item{display:flex;gap:10px;align-items:center;padding:2px 3px}.up-day{width:42px;height:44px;border-radius:11px;background:#eff4ed;display:grid;place-content:center;text-align:center;flex:none}.up-day strong{font-size:14px;line-height:1.05;color:#3a6147}.up-day small{font-size:9px;color:#879289}.up-info{min-width:0;flex:1}.up-title{font-weight:680;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.up-sub{font-size:10px;color:#8c968d;margin-top:3px}.up-dot{width:8px;height:8px;border-radius:50%;background:#72927a;flex:none}.up-dot.task{background:var(--orange)}.toast{position:fixed;right:22px;bottom:22px;background:#263d30;color:#fff;padding:12px 17px;border-radius:12px;box-shadow:0 12px 34px #0002;opacity:0;transform:translateY(10px);transition:.22s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:translateY(0)}.modal-backdrop{position:fixed;inset:0;background:rgba(29,43,33,.52);backdrop-filter:blur(4px);display:none;place-items:center;padding:16px;z-index:20}.modal-backdrop.open{display:grid}.detail-list{margin:0}.detail-row{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:10px 2px;border-bottom:1px solid var(--line)}.detail-row:last-child{border-bottom:0}.detail-row dt{color:var(--muted);font-size:12px}.detail-row dd{margin:0;font-size:13px;overflow-wrap:anywhere}.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid #e9eee8;border-radius:19px;padding:23px;box-shadow:0 24px 70px #0003}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-header h2{margin:0;font-size:18px}.close{border:0;background:#f1f4ef;border-radius:50%;width:32px;height:32px;color:#667268;font-size:19px}.close:hover{background:#e4ece3}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#626f65;font-weight:680}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none;color:#333d34}.field textarea{resize:vertical;min-height:65px}.form-help{font-size:10px;color:#96a098}.checkline{display:flex;align-items:center;gap:8px;font-size:11px;color:#657168}.checkline input{accent-color:var(--green)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.mobile-nav{display:none}

</style><style>#authGate{min-height:100vh;display:grid;place-content:center;gap:14px;padding:28px;text-align:center;background:#f5f7f3}#authGate button{padding:12px 18px;border:1px solid #d9dfda;border-radius:10px;background:white;cursor:pointer}#authError{color:#a44536}.signed-in-user{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}[hidden]{display:none!important}.sync-status{font-size:11px;color:var(--muted);white-space:nowrap}.sync-status.error{color:#a44536}@media(max-width:650px){.sync-status{display:none}}

<body><section id="authGate"><h1>登入後開始安排</h1><p>點擊登入後，會前往 Google 選擇帳戶並完成驗證。</p><button id="googleSignIn" type="button">使用 Google 帳戶登入</button><p id="authError" role="alert" hidden></p></section><div class="app" id="plannerApp" hidden><aside class="sidebar"><div class="brand"><span class="logo">◷</span><span>日序</span></div><nav class="nav"><button class="active" data-page="today"><span class="ico">⌂</span>總覽</button><button data-page="calendar"><span class="ico">▦</span>行事曆</button><button data-page="tasks"><span class="ico">☑</span>所有任務</button></nav><div><div class="side-label">我的分類 <button class="add-cat" id="addCat" style="float:right;padding:0 8px">＋ 新增</button></div><div class="category-list" id="categoryList"></div></div><div class="side-bottom">保持有序，留點空間給生活。<br>行程與任務會同步至 Firebase 雲端。</div></aside><main class="main"><header class="topline"><div><div class="today-datetime"><span class="today-date" id="todayDate"></span><span class="live-clock" id="liveClock" aria-live="off"></span></div><div class="title" id="pageTitle">今日總覽</div><div class="greeting" id="greeting">早安，今天也為自己留一點餘裕</div></div><div class="actions"><span class="signed-in-user" id="signedInUser" hidden></span><span class="sync-status" id="syncStatus" aria-live="polite"></span><button class="secondary" id="signOutBtn" type="button">登出</button><button class="icon-btn" id="notifyBtn" title="提醒">♧<span class="badge"></span></button><button class="secondary" id="todayBtn">回到今天</button><button class="primary" id="addBtn">＋ 新增行程</button></div></header><section class="hero"><div class="welcome"><div><div class="welcome-kicker">TODAY’S QUEST <span>✦</span></div><h2 id="welcomeTitle">今天的主線任務：把日子過得精彩！</h2><p id="welcomeText">行程已就位，挑一件喜歡的事開始吧。</p></div><div class="welcome-mark" aria-hidden="true">🪴<span>✦</span></div></div><div class="stats"><div class="stat-card"><div class="stat-label">今日行程</div><div class="stat-num" id="statEvents">0</div><div class="stat-foot">安排好的時光</div></div><div class="stat-card"><div class="stat-label">待完成任務</div><div class="stat-num" id="statTasks">0</div><div class="stat-foot">一步步完成即可</div></div></div></section><div class="content-grid"><section class="panel" id="calendarPanel"><div class="panel-head"><div class="panel-title">行事曆</div><select id="categoryFilter" class="filter-select" aria-label="依分類篩選"><option value="all">所有分類</option></select><div class="view-switch" id="viewSwitch"><button class="active" data-view="month">月</button><button data-view="week">週</button><button data-view="day">日</button></div><div class="date-nav"><button id="prevDate">‹</button><div class="date-text" id="dateLabel"></div><button id="nextDate">›</button></div></div><div id="calendarBody"></div><div class="cal-foot"><div class="legend"><span><i class="dot" style="--c:#73917a"></i>行程</span><span><i class="dot" style="--c:#d88b61"></i>任務</span></div><span>選取日期查看安排</span></div></section><section class="panel agenda-panel"><div class="panel-head"><div class="panel-title">今日安排</div><select id="agendaFilter" class="filter-select" aria-label="安排分類篩選"><option value="all">所有分類</option></select><button class="view-all" id="seeAgenda">查看日程 →</button></div><div class="agenda-date" id="agendaDate"></div><div class="agenda-list" id="agendaList"></div></section><aside class="right-column"><section class="panel task-panel"><div class="panel-head"><div class="panel-title">待辦任務</div><select id="taskFilter" class="filter-select" aria-label="任務分類篩選"><option value="all">所有分類</option></select><button class="view-all" id="seeTasks">全部 →</button></div><div class="task-list" id="taskList"></div><div class="quick"><input id="quickInput" placeholder="快速新增任務…"><button id="quickAdd">快速新增</button><button type="button" id="fullTaskAdd">完整新增</button></div></section><section class="panel"><div class="panel-head"><div class="panel-title">本週進度</div><span style="font-size:11px;color:#92988e" id="weekPercent">0%</span></div><div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div><div class="progress"><span>已完成任務</span><span id="progressText">0 / 0</span></div><div style="border-top:1px solid var(--line);margin:15px 0"></div><div class="panel-head" style="margin-bottom:12px"><div class="panel-title">接下來</div></div><div class="upcoming" id="upcoming"></div></section></aside></div></main></div><nav class="mobile-nav" hidden><button class="active" data-page="today"><span>⌂</span>總覽</button><button data-page="calendar"><span>▦</span>行事曆</button><button data-page="tasks"><span>☑</span>任務</button></nav><div class="toast" id="toast"></div><div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-header"><h2 id="modalTitle">新增行程</h2><button class="close" id="closeModal">×</button></div><form id="itemForm"><div class="form-grid"><div class="field full"><label>項目類型</label><select id="itemType"><option value="event">行程</option><option value="task">任務</option></select></div><div class="field full"><label for="itemTitle">標題 *</label><input id="itemTitle" required placeholder="例如：專題討論、閱讀課本"></div><div class="field"><label for="itemDate">日期 *</label><input id="itemDate" type="date" required></div><div class="field"><label for="itemCategory">分類</label><select id="itemCategory"></select></div><div class="field"><label for="itemStart">開始時間 *</label><input id="itemStart" type="time" required></div><div class="field"><label for="itemEnd">結束時間 *</label><input id="itemEnd" type="time" required></div><div class="field" id="deadlineWrap" style="display:none"><label for="itemDeadline">截止日期 *</label><input id="itemDeadline" type="date"></div><div class="field" id="priorityWrap" style="display:none"><label for="itemPriority">優先級</label><select id="itemPriority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></div><div class="field full"><label for="itemPlace">地點／線上連結</label><input id="itemPlace" placeholder="例如：圖書館、線上會議網址"></div><div class="field full"><label fo
